    # ───────── Conversation ─────────
    CreateConversationRequest:
      type: object
      required: [targetGrade, backgroundSurvey]
      properties:
        targetGrade:
          description: 목표 등급
          $ref: '#/components/schemas/Grade'
        backgroundSurvey:
          description: 배경 설문 답
          $ref: '#/components/schemas/BackgroundSurvey'

    CreateConversationResponse:
      type: object
      required: [conversationId]
      properties:
        conversationId:
          type: integer
          format: int64
          description: 생성된 대화 ID
          example: 42

    ConversationSummary:
      type: object
      description: 홈 목록의 한 줄 ("대화 4회차 · 목표 AL · 2025년 8월 1일" + 상태 또는 종합 예상 등급)
      required: [conversationId, round, targetGrade, status, overallEstimatedGrade, createdAt]
      properties:
        conversationId:
          description: 대화 ID
          type: integer
          format: int64
          example: 42
        round:
          type: integer
          description: N회차 (사용자별 1부터)
          example: 2
        targetGrade:
          description: 목표 등급 (부제의 "목표 AL")
          $ref: '#/components/schemas/Grade'
        status:
          description: |
            - 대화 상태.
          $ref: '#/components/schemas/ConversationStatus'
        overallEstimatedGrade:
          description: |
            - 종합 예상 등급 (목록 뱃지).
            - COMPLETED인 대화는 항상 값이 있고, IN_PROGRESS면 null
          oneOf:
            - $ref: '#/components/schemas/Grade'
            - type: 'null'
          example: IH
        createdAt:
          description: 대화 생성 시각 (부제의 날짜)
          type: string
          format: date-time
          example: '2026-11-18T10:00:00+09:00'

    ConversationListResponse:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          description: 필터 조건에 맞는 전체 개수 ("대화 4개")
          example: 2
        items:
          description: 대화 목록 (회차 내림차순)
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
      example:
        totalCount: 2
        items:
          - conversationId: 42
            round: 2
            targetGrade: AL
            status: IN_PROGRESS
            overallEstimatedGrade: null
            createdAt: '2026-11-18T10:00:00+09:00'
          - conversationId: 17
            round: 1
            targetGrade: IM3
            status: COMPLETED
            overallEstimatedGrade: IM3
            createdAt: '2026-11-10T21:30:00+09:00'

    ConversationDetailResponse:
      type: object
      description: 대화 상세 조회 응답
      required: [conversationId, round, targetGrade, status, totalQuestionCount, currentQuestionNumber, questions, createdAt]
      properties:
        conversationId:
          description: 대화 ID
          type: integer
          format: int64
          example: 42
        round:
          description: N회차 (사용자별 1부터)
          type: integer
          example: 2
        targetGrade:
          description: 목표 등급
          $ref: '#/components/schemas/Grade'
        status:
          description: 대화 상태
          $ref: '#/components/schemas/ConversationStatus'
        totalQuestionCount:
          description: 전체 문항 수 (화면의 "N / 15")
          type: integer
          example: 15
        currentQuestionNumber:
          type: [integer, 'null']
          description: |
            - 지금 풀 차례인 문항 번호 (화면의 "N / 15"). 답변을 제출할 때마다 1씩 올라갑니다
            - 목록에서 대화를 다시 열면 이 번호의 문항부터 이어서 풉니다
            - 15문항을 다 답했으면 null
          example: 2
        questions:
          type: array
          description: 15문항 전체 (문항 번호 순)
          items:
            $ref: '#/components/schemas/ConversationQuestionItem'
        createdAt:
          description: 대화 생성 시각
          type: string
          format: date-time
          example: '2026-11-18T10:00:00+09:00'
      example:
        conversationId: 42
        round: 2
        targetGrade: AL
        status: IN_PROGRESS
        totalQuestionCount: 15
        currentQuestionNumber: 2
        questions:
          - questionNumber: 1
            questionAudioUrl: https://storage.example.com/questions/42/1.mp3
            questionAudioDurationSeconds: 9
            questionText: Let's start the interview now. Tell me a little bit about yourself.
            replayRemaining: 1
            answer:
              transcript: Hi, my name is Minji. I'm a college student majoring in business, and I live in Seoul with my family.
              audioUrl: https://storage.example.com/answers/42/1.m4a
              durationSeconds: 48
              answeredAt: '2026-11-18T10:02:10+09:00'
            feedback:
              estimatedGrade: IM2
              targetGrade: AL
              improvementTips:
                - 전공과 사는 곳 외에 성격이나 취미를 덧붙이면 자기소개가 풍성해져요.
                - and로만 잇지 말고 which, so 같은 연결어를 써 보세요.
              recommendedScript: Hi, I'm Minji. I'm a business major in college, and I live in Seoul with my family, which keeps me pretty busy but happy.
              keyExpressions: [business major, keeps me busy]
          - questionNumber: 2
            questionAudioUrl: https://storage.example.com/questions/42/2.mp3
            questionAudioDurationSeconds: 15
            questionText: null
            replayRemaining: 1
            answer: null
            feedback: null
        createdAt: '2026-11-18T10:00:00+09:00'

    ConversationQuestionItem:
      type: object
      description: 대화 상세의 문항 하나. 답변 전에는 질문 음성만, 답변 후에는 질문 텍스트·답변·답변 분석이 채워집니다.
      required: [questionNumber, questionAudioUrl, questionAudioDurationSeconds, questionText, replayRemaining, answer, feedback]
      properties:
        questionNumber:
          description: 문항 번호 (1~15)
          type: integer
          example: 1
        questionAudioUrl:
          description: Eva 질문 음성 URL (만료 없음)
          type: string
          format: uri
          example: https://storage.example.com/questions/42/1.mp3
        questionAudioDurationSeconds:
          description: 질문 음성 길이(초)
          type: integer
          example: 15
        questionText:
          type: [string, 'null']
          description: |
            - 질문 원문
            - 답변하기 전에는 null (질문은 음성으로만 제공)
          example: You indicated in the survey that you enjoy going to parks. Tell me about a park you often visit.
        replayRemaining:
          description: 남은 다시 듣기 횟수 (0 또는 1)
          type: integer
          example: 1
        answer:
          description: 사용자 답변. 답변 전에는 null
          oneOf:
            - $ref: '#/components/schemas/Answer'
            - type: 'null'
        feedback:
          description: 답변 분석. 답변 전에는 null
          oneOf:
            - $ref: '#/components/schemas/QuestionFeedback'
            - type: 'null'

    Answer:
      type: object
      required: [transcript, audioUrl, durationSeconds, answeredAt]
      properties:
        transcript:
          type: string
          description: 음성 인식 결과 (화면의 "나의 답변")
          example: I often go to Hangang Park near my house. It is very big and has many trees. I usually walk there with my friend on weekends, and we talk a lot.
        audioUrl:
          type: string
          format: uri
          description: 사용자가 녹음한 음성
          example: https://storage.example.com/answers/42/1.m4a
        durationSeconds:
          description: 녹음 길이(초)
          type: integer
          example: 42
        answeredAt:
          description: 답변 제출 시각
          type: string
          format: date-time
          example: '2026-11-18T10:03:12+09:00'

    SubmitAnswerRequest:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          contentMediaType: audio/mp4
          description: |
            - 녹음 파일 (binary).
            - m4a·aac·wav, 최대 2분, 최대 10MB
          example: answer.m4a

    SubmitAnswerResponse:
      type: object
      description: 답변 제출 응답. 방금 답한 문항의 질문 텍스트·답변·답변 분석과 다음 진행 정보
      required: [questionNumber, questionText, answer, feedback, currentQuestionNumber]
      properties:
        questionNumber:
          description: 방금 답한 문항 번호
          type: integer
          example: 1
        questionText:
          description: 질문 원문 (답변 후 공개)
          type: string
          example: Let's start the interview now. Tell me a little bit about yourself.
        answer:
          description: 방금 제출한 답변
          $ref: '#/components/schemas/Answer'
        feedback:
          description: 답변 분석 ("Eva의 답변 분석")
          $ref: '#/components/schemas/QuestionFeedback'
        currentQuestionNumber:
          type: [integer, 'null']
          description: |
            - 답변을 제출해서 넘어간 다음 문제 번호 (방금 답한 번호 + 1)
            - 15번에 답했으면 null (다음은 종합 피드백 생성)
          example: 2

    ReplayResponse:
      type: object
      required: [questionNumber, replayRemaining, questionAudioUrl]
      properties:
        questionNumber:
          description: 문항 번호
          type: integer
          example: 1
        replayRemaining:
          description: 남은 다시 듣기 횟수 (호출 후 0)
          type: integer
          example: 0
        questionAudioUrl:
          description: 다시 재생할 질문 음성 URL
          type: string
          format: uri
          example: https://storage.example.com/questions/42/1.mp3

    # ───────── Feedback ─────────
    QuestionFeedback:
      type: object
      description: 답변 분석 ("Eva의 답변 분석")
      required: [estimatedGrade, targetGrade, improvementTips, recommendedScript, keyExpressions]
      properties:
        estimatedGrade:
          description: 이 답변의 예상 등급
          $ref: '#/components/schemas/Grade'
        targetGrade:
          description: 목표 등급 (대화의 목표 등급)
          $ref: '#/components/schemas/Grade'
        improvementTips:
          type: array
          description: 답변 디벨롭 — 목표 등급 기준 개선 방법 (한국어, 2~5개)
          minItems: 2
          maxItems: 5
          items:
            type: string
          example:
            - very big, many trees 같은 단순한 표현 대신 공원의 분위기와 풍경을 구체적으로 묘사해 보세요.
            - 주말 루틴에 이유나 느낌을 덧붙이면 AL 수준의 전개가 돼요.
            - which, so 같은 연결어로 문장을 이어 길고 자연스럽게 말해 보세요.
        recommendedScript:
          type: string
          description: 추천 스크립트 ("이렇게 말해 보세요") — 개선된 예시 답변 (영어)
          example: Hangang Park is a short walk from my place, and it is lined with tall trees and a long cycling path. On weekends, my friend and I usually take a slow walk there, which helps me unwind after a busy week.
        keyExpressions:
          type: array
          description: 주요 단어 — 추천 스크립트의 핵심 표현
          items:
            type: string
          example: [lined with, cycling path, slow walk, unwind, short walk]

    CreateOverallFeedbackResponse:
      type: object
      description: 종합 피드백 생성("전체 피드백 보기") 응답
      required: [conversationId, totalQuestionCount, overallEstimatedGrade, targetGrade, areaScores, strengths, weaknesses, recommendedStudies, frequentExpressions, closingMessage]
      properties:
        conversationId:
          description: 대화 ID
          type: integer
          format: int64
          example: 42
        totalQuestionCount:
          description: 전체 문항 수 ("총 15문제")
          type: integer
          example: 15
        overallEstimatedGrade:
          description: 종합 예상 등급
          $ref: '#/components/schemas/Grade'
        targetGrade:
          description: 목표 등급
          $ref: '#/components/schemas/Grade'
        areaScores:
          description: 영역별 평가 (0~100)
          $ref: '#/components/schemas/AreaScores'
        strengths:
          type: array
          description: 잘한 점
          items:
            type: string
          example:
            - 질문에 맞는 답변을 끝까지 이어 말했어요.
            - 일상 주제에서 어휘가 자연스러웠어요.
        weaknesses:
          type: array
          description: 보완할 점
          items:
            type: string
          example:
            - 시제 일치와 연결어 사용이 아직 불안정해요.
            - 같은 표현을 반복하는 경향이 있어요.
        recommendedStudies:
          type: array
          description: 추천 학습
          items:
            type: string
          example:
            - 연결어 표현을 정리하고 한 문제당 3문장 이어 말하기
            - 주제별 핵심 표현 10개씩 정리하기
        frequentExpressions:
          type: array
          description: 자주 쓴 표현
          items:
            type: string
          example: [very big, many, a lot, really]
        closingMessage:
          type: string
          description: Eva의 마무리 메시지 (결과에 맞춰 AI가 작성)
          example: 오늘 정말 고생 많았어요. 꾸준히 연습하면 목표인 AL에 충분히 가까워질 수 있어요. 다음 모의고사에서 또 만나요!

    OverallFeedbackResponse:
      type: object
      description: 종합 피드백 조회 응답
      required: [conversationId, totalQuestionCount, overallEstimatedGrade, targetGrade, areaScores, strengths, weaknesses, recommendedStudies, frequentExpressions, closingMessage]
      properties:
        conversationId:
          description: 대화 ID
          type: integer
          format: int64
          example: 42
        totalQuestionCount:
          description: 전체 문항 수 ("총 15문제")
          type: integer
          example: 15
        overallEstimatedGrade:
          description: 종합 예상 등급
          $ref: '#/components/schemas/Grade'
        targetGrade:
          description: 목표 등급
          $ref: '#/components/schemas/Grade'
        areaScores:
          description: 영역별 평가 (0~100)
          $ref: '#/components/schemas/AreaScores'
        strengths:
          type: array
          description: 잘한 점
          items:
            type: string
          example:
            - 질문에 맞는 답변을 끝까지 이어 말했어요.
            - 일상 주제에서 어휘가 자연스러웠어요.
        weaknesses:
          type: array
          description: 보완할 점
          items:
            type: string
          example:
            - 시제 일치와 연결어 사용이 아직 불안정해요.
            - 같은 표현을 반복하는 경향이 있어요.
        recommendedStudies:
          type: array
          description: 추천 학습
          items:
            type: string
          example:
            - 연결어 표현을 정리하고 한 문제당 3문장 이어 말하기
            - 주제별 핵심 표현 10개씩 정리하기
        frequentExpressions:
          type: array
          description: 자주 쓴 표현
          items:
            type: string
          example: [very big, many, a lot, really]
        closingMessage:
          type: string
          description: Eva의 마무리 메시지 (결과에 맞춰 AI가 작성)
          example: 오늘 정말 고생 많았어요. 꾸준히 연습하면 목표인 AL에 충분히 가까워질 수 있어요. 다음 모의고사에서 또 만나요!

    AreaScores:
      type: object
      required: [fluency, vocabulary, grammar, organization]
      properties:
        fluency:
          type: integer
          description: 유창성
          minimum: 0
          maximum: 100
          example: 60
        vocabulary:
          type: integer
          description: 어휘
          minimum: 0
          maximum: 100
          example: 55
        grammar:
          type: integer
          description: 문법
          minimum: 0
          maximum: 100
          example: 65
        organization:
          type: integer
          description: 내용 구성
          minimum: 0
          maximum: 100
          example: 50

  responses:
    BadRequest:
      description: 입력값 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            code: INVALID_INPUT_VALUE
            message: 적절하지 않은 값입니다.
    Unauthorized:
      description: 토큰 없음·만료·무효 → 다시 로그인
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              summary: 토큰 없음
              value:
                status: 401
                code: UNAUTHORIZED
                message: 인증이 필요합니다.
            expired:
              summary: 토큰 만료(30일) → 다시 로그인
              value:
                status: 401
                code: EXPIRED_TOKEN
                message: 만료된 토큰입니다.
            invalid:
              summary: 잘못된 토큰, 로그아웃·탈퇴한 토큰 → 다시 로그인
              value:
                status: 401
                code: INVALID_TOKEN
                message: 유효하지 않은 토큰입니다.
    NotConversationOwner:
      description: 다른 사용자의 대화
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            code: NOT_CONVERSATION_OWNER
            message: 해당 대화에 접근할 권한이 없습니다.
    ConversationNotFound:
      description: 대화 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            code: CONVERSATION_NOT_FOUND
            message: 대화를 찾을 수 없습니다.
    ConversationOrQuestionNotFound:
      description: 대화가 없거나(CONVERSATION_NOT_FOUND), 문항 번호가 1~15 범위 밖(QUESTION_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conversation:
              summary: 대화 없음
              value:
                status: 404
                code: CONVERSATION_NOT_FOUND
                message: 대화를 찾을 수 없습니다.
            question:
              summary: 문항 없음
              value:
                status: 404
                code: QUESTION_NOT_FOUND
                message: 문항을 찾을 수 없습니다.
