spring:
  application:
    name: helloeva-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          json_format_mapper: jackson3
  flyway:
    enabled: true
    locations: classpath:db/migration
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30d

kakao:
  api:
    base-url: https://kapi.kakao.com

ai:
  pricing:
    gemini-input-per-million-tokens: 0.25
    gemini-output-per-million-tokens: 1.50
    tts-per-million-characters: 4.00
    stt-per-minute: 0.016
