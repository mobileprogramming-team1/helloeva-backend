spring:
  application:
    name: helloeva-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          json_format_mapper: jackson3
  flyway:
    enabled: true
    locations: classpath:db/migration
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30d

kakao:
  api:
    base-url: https://kapi.kakao.com

gcp:
  project-id: helloeva-a5e901
  storage:
    bucket: helloeva-a5e901-audio
  vertex:
    location: global

ai:
  gemini:
    model: gemini-3.1-flash-lite
  tts:
    language-code: en-US
    voice-name: en-US-Wavenet-F
  pricing:
    gemini-input-per-million-tokens: 0.25
    gemini-audio-input-per-million-tokens: 0.50
    gemini-output-per-million-tokens: 1.50
    tts-per-million-characters: 4.00
